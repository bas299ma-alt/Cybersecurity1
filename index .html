<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2a20;--card:#123d2f;--ink:#f6f1d6;--sub:#b5d3c4;--line:#E8B923}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Almarai,Tahoma,Arial,sans-serif;font-weight:700;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800}
.pill{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:4px 14px;font-size:17px}
button{font-family:inherit;cursor:pointer}
.mute{background:none;border:0;font-size:22px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:18px;margin:14px 0}
h1{font-family:Lalezar,Almarai,Tahoma,sans-serif;font-size:36px;font-weight:400;margin:6px 0;line-height:1.2}
h2{font-family:Lalezar,Almarai,Tahoma,sans-serif;font-size:25px;font-weight:400;margin:0 0 10px;line-height:1.4}
p{line-height:1.8;font-size:18px;margin:6px 0;color:var(--sub)}
.mascot{font-size:84px;text-align:center;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.btn{display:block;width:100%;background:var(--y);color:#0B3D2E;border:3px solid #0B3D2E;border-radius:18px;box-shadow:0 5px 0 #0B3D2E;font-size:22px;font-weight:900;padding:12px;margin-top:12px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #14213D}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:16px;font-size:19px;font-weight:800;padding:13px 14px;margin:10px 0;min-height:52px}
.opt.ok{background:var(--g);color:#fff;border-color:var(--g)}
.opt.no{background:var(--r);color:#fff;border-color:var(--r);animation:sh .35s}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.lv{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin:10px 0;font-size:20px;font-weight:900}
.lv[disabled]{opacity:.45}
.lv .ic{font-size:36px}
.bar{height:14px;border-radius:9px;background:#0002;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--g);width:0;transition:width .3s}
.msg{background:#fff;color:#14213D;border:3px dashed #14213D;border-radius:16px;padding:12px;font-size:19px;line-height:1.8;margin:8px 0}
.why{border-radius:14px;padding:10px 12px;margin-top:8px;font-size:18px;line-height:1.7;font-weight:800}
.why.g{background:#1fae9f33}.why.r{background:#e8505b33}
.chk{display:flex;gap:8px;align-items:center;font-size:18px;font-weight:800;padding:3px 0;color:var(--sub)}
.chk.on{color:var(--g)}
input{width:100%;font:inherit;font-size:22px;padding:11px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);direction:ltr;text-align:center}
.stars{font-size:30px;letter-spacing:4px}
.cert{border:5px double var(--line);border-radius:18px;padding:16px;text-align:center;background:var(--card)}
.fx{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:fall 1.8s ease-in forwards;z-index:9}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}.girl{display:block;margin:6px auto;width:150px;height:auto;animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const s=st.err==0?3:st.err<=3?2:1;S.stars[st.l]=Math.max(S.stars[st.l],s);S.done[st.l]=1;S.score+=s*5;jingle();fx(all0()?"🏆":"🎉");
const all=S.done.every(x=>x);
$("app").innerHTML=hdr()+`<div class="card" style="text-align:center"><div class="mascot">${all?"🏆":"🎖️"}</div><h1>${all?"أصبحت حارس إنترنت!":"وسام «"+L.n+"»"}</h1><div class="stars">${"⭐".repeat(s)+"☆".repeat(3-s)}</div><p>تقييمك: <b>${RL[s]}</b></p><p>نقاطك: ${S.score}</p>${all?fin():""}</div>`+(all?`<div class="cert"><h2>🏅 شهادة حارس الإنترنت الصغير</h2><p>اجتزتَ مهام كلمات المرور والرسائل المخادعة وحماية الأسرار. استمر في حماية نفسك!</p><div style="font-weight:800;font-size:16px;line-height:1.9">تفعيل أسبوع الأمن السيبراني<br>ابتدائية تحفيظ القرآن الكريم الثانية في الرس<br>إعداد المعلمات: ابتسام الحربي، منال البويليد، حصه عامر الغفيلي، فايزة الرحيمي<br>رائدة النشاط: زينب اللهيبي<br>مديرة المدرسة: ندى الشعبي</div></div>`:"")+`<button class="btn" onclick="home()">${all?"الرئيسية":"المهمة التالية ◀"}</button>`+(all?`<button class="btn" style="background:var(--card);color:var(--ink)" onclick="reset();home()">🔁 العب من جديد</button>`:"")}
reset();home();
</script>
